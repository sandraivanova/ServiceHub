# Continuous Integration / Delivery for ServiceHub.
#
# On every push to main: build the backend and frontend Docker images and
# push them to Docker Hub, tagged with both "latest" and the commit SHA
# (so any past build can be pulled back by its exact tag).
# On pull requests: build only, as a sanity check - nothing is pushed.
#
# Requires two repository secrets (Settings -> Secrets and variables ->
# Actions), see docs/03-ci-cd-pipeline.md for how to create them:
#   DOCKERHUB_USERNAME - your Docker Hub username
#   DOCKERHUB_TOKEN     - a Docker Hub access token (not your password)

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-push-backend:
    name: Build & push backend image
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/servicehub-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/servicehub-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-frontend:
    name: Build & push frontend image
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/servicehub-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/servicehub-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
