<main>
  <section class="bg-blue-900 text-white px-8 py-16 relative overflow-hidden">
    <div class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
      <div>
        <h1 class="text-4xl md:text-5xl font-extrabold leading-tight mb-4">
          Најдете го вистинскиот професионалец за секоја работа.
        </h1>
        <p class="text-blue-200 text-base mb-8">
          Пронајдете и резервирајте доверливи професионалци за сите ваши потреби.
        </p>

        <div class="bg-white p-2 rounded-xl shadow-lg flex flex-col md:flex-row items-center space-y-2 md:space-y-0 md:space-x-2 max-w-xl">
          <input type="text" placeholder="Која услуга ја барате?" class="w-full px-4 py-3 text-gray-700 text-sm focus:outline-none" />

          <!-- Додадено flex items-center space-x-2 за иконата и текстот да бидат хоризонтално -->
          <div class="w-full md:w-auto border-t md:border-t-0 md:border-l border-gray-200 px-4 py-3 text-gray-400 text-sm flex items-center space-x-2">
            <span>📍</span>
            <span>Локација</span>
          </div>

          <button class="w-full md:w-auto bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-3 rounded-lg transition-all">
            Пребарај
          </button>
        </div>

        <div class="flex space-x-12 mt-12 text-sm">
          <div>
            <p class="text-2xl font-bold">15,000+</p>
            <p class="text-blue-300 text-xs">Задоволни клиенти</p>
          </div>
          <div>
            <p class="text-2xl font-bold">5,000+</p>
            <p class="text-blue-300 text-xs">Даватели на услуги</p>
          </div>
          <div>
            <p class="text-2xl font-bold">4.8</p>
            <p class="text-blue-300 text-xs">Просечна оцена</p>
          </div>
        </div>
      </div>

      <div class="flex justify-end">
        <div class="w-72 h-80  rounded-2xl flex items-center justify-center">
          <img src="/assets/c2-removebg-preview.png" height="529" width="348"/></div>
      </div>

    </div>
  </section>

  <section class="max-w-7xl mx-auto px-8 py-12">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-xl font-bold text-gray-900">Популарни категории</h2>
      <a href="#" class="text-sm font-semibold text-blue-600 hover:underline">Види ги сите</a>
    </div>
    <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-8 gap-4">
      <div *ngFor="let cat of categories" class="bg-white border border-gray-100 p-4 rounded-xl shadow-sm hover:shadow-md transition-all text-center cursor-pointer flex flex-col items-center justify-center space-y-2">
        <span class="text-2xl">{{ cat.icon }}</span>
        <span class="text-xs font-medium text-gray-700">{{ cat.name }}</span>
      </div>
    </div>
  </section>
</main>
