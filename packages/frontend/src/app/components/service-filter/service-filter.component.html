<div class="w-full bg-white p-4 md:p-5 rounded-3xl border border-slate-100 shadow-sm border-b-4  flex flex-col md:flex-row items-center gap-3 mb-8">

  <div class="relative w-full md:w-72">
    <span class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-slate-400 text-sm">
      🔍
    </span>
    <input
      type="text"
      [(ngModel)]="searchTerm"
      (ngModelChange)="emitFilters()"
      placeholder="Пребарај услуга..."
      class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200/80 rounded-2xl text-sm font-medium text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all"
    />
  </div>

  <div class="relative w-full md:flex-1">
    <select
      [(ngModel)]="category"
      (ngModelChange)="emitFilters()"
      class="w-full px-4 py-3 bg-slate-50 border border-slate-200/80 rounded-2xl text-sm font-medium text-slate-900 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all appearance-none cursor-pointer"
    >
      <option value="">Сите категории</option>
      @for (cat of categories; track cat) {
        <option [value]="cat">{{ categoryLabels[cat] }}</option>
      }
    </select>
    <span class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-slate-400 text-xs">
      ▼
    </span>
  </div>

  <div class="relative w-full md:flex-1">
    <select
      [(ngModel)]="location"
      (ngModelChange)="emitFilters()"
      class="w-full px-4 py-3 bg-slate-50 border border-slate-200/80 rounded-2xl text-sm font-medium text-slate-900 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all appearance-none cursor-pointer"
    >
      <option value="">Сите локации</option>
      @for (loc of locations; track loc) {
        <option [value]="loc">{{ locationLabels[loc] }}</option>
      }
    </select>
    <span class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-slate-400 text-xs">
      ▼
    </span>
  </div>

</div>
