<div class="max-w-7xl mx-auto p-6 space-y-6 bg-gray-50 min-h-screen">

  <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">Нудам услуга</h1>
      <p class="text-sm text-gray-500 mt-1">Огласи на работници, мајстори и фирми кои нудат услуги</p>
    </div>
    <button (click)="openModal()"
            class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-3 rounded-xl transition duration-200 shadow-md flex items-center gap-2">
      <span class="text-lg">+</span> Објави оглас – Нудам услуга
    </button>
  </div>

  <div *ngIf="isModalOpen" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4 backdrop-blur-sm">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl overflow-hidden transform transition-all">

      <div class="flex justify-between items-center px-6 py-4 border-b border-gray-100 bg-gray-50">
        <h2 class="text-xl font-bold text-gray-800">Креирај нова услуга</h2>
        <button (click)="closeModal()" class="text-gray-400 hover:text-gray-600 text-2xl font-bold focus:outline-none">&times;</button>
      </div>

      <form (submit)="createService()" class="p-6 space-y-4 max-h-[80vh] overflow-y-auto">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1 uppercase tracking-wide">Наслов</label>
            <input type="text" placeholder="пр. Професионално молерирање" [(ngModel)]="newService.title" name="title" required
                   class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1 uppercase tracking-wide">Цена од (€)</label>
            <input type="number" placeholder="пр. 50" [(ngModel)]="newService.priceFrom" name="priceFrom" required
                   class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1 uppercase tracking-wide">Единица за цена</label>
            <select [(ngModel)]="newService.priceUnit" name="priceUnit"
                    class="w-full px-4 py-2.5 border border-gray-300 rounded-xl bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
              <option *ngFor="let unit of priceUnits" [value]="unit">{{ unit }}</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1 uppercase tracking-wide">Категорија</label>
            <select [(ngModel)]="newService.category" name="category"
                    class="w-full px-4 py-2.5 border border-gray-300 rounded-xl bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
              <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1 uppercase tracking-wide">Години искуство</label>
            <input type="number" placeholder="пр. 5" [(ngModel)]="newService.yearsOfExperience" name="yearsOfExperience"
                   class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1 uppercase tracking-wide">Достапност</label>
            <input type="text" placeholder="пр. Флексибилно / Секој ден" [(ngModel)]="newService.availability" name="availability"
                   class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1 uppercase tracking-wide">Телефон за контакт</label>
            <input type="text" placeholder="пр. 070 123 456" [(ngModel)]="newService.phone" name="phone" required
                   class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1 uppercase tracking-wide">Локација</label>
            <input type="text" placeholder="пр. Скопје" [(ngModel)]="newService.location" name="location" required
                   class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1 uppercase tracking-wide">Опис</label>
          <textarea placeholder="Внесете детален опис на вашата услуга..." [(ngModel)]="newService.description" name="description" required rows="3"
                    class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm"></textarea>
        </div>

        <div class="flex justify-end gap-3 pt-4 border-t border-gray-100">
          <button type="button" (click)="closeModal()"
                  class="px-5 py-2.5 rounded-xl border border-gray-300 text-gray-700 hover:bg-gray-100 font-medium text-sm transition">
            Откажи
          </button>
          <button type="submit"
                  class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2.5 rounded-xl text-sm transition duration-200 shadow-md">
            Зачувај услуга
          </button>
        </div>
      </form>

    </div>
  </div>

  <div class="space-y-4">
    <h3 class="text-xl font-bold text-gray-800">{{ services.length }} огласи</h3>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div *ngFor="let s of services" class="p-5 bg-white border border-gray-200 rounded-2xl shadow-sm hover:shadow-md transition duration-200 flex flex-col justify-between">
        <div>
          <div class="flex justify-between items-start mb-3">
            <span class="text-xs bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-1 rounded-full font-medium">{{ s.category }}</span>
          </div>

          <h4 class="text-lg font-bold text-gray-900">{{ s.title }}</h4>
          <p class="text-sm text-gray-600 mt-2 line-clamp-3">{{ s.description }}</p>

          <div class="mt-4 space-y-1.5 text-sm text-gray-600">
            <div class="flex items-center gap-2">
              <span>📍</span>
              <span class="font-medium text-gray-700">{{ s.location }}</span>
            </div>
          </div>
        </div>

        <div class="mt-6 pt-4 border-t border-gray-100 flex items-center justify-between">
          <div>
            <span class="text-lg font-bold text-gray-900">{{ s.priceFrom }}€</span>
            <span class="text-xs text-gray-500 block">/ {{ s.priceUnit }}</span>
          </div>
          <a [routerLink]="['/giving-services', s.id]" class="px-4 py-2 border border-blue-600 text-blue-600 hover:bg-blue-50 font-medium rounded-xl text-sm transition">
            Погледни оглас
          </a>
        </div>
      </div>
    </div>
  </div>

</div>
