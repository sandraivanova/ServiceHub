<div class="max-w-md mx-auto mt-12 p-6 bg-white border border-gray-200 rounded-lg shadow-md">
  <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Најава</h2>

  <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
    <div class="mb-4">
      <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Е-пошта:</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="example@email.com"
      />
      @if (loginForm.get('email')?.invalid && loginForm.get('email')?.touched) {
        <div class="text-red-500 text-xs mt-1">
          Внесете валидна е-пошта.
        </div>
      }
    </div>

    <div class="mb-4">
      <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Лозинка:</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
      @if (loginForm.get('password')?.invalid && loginForm.get('password')?.touched) {
        <div class="text-red-500 text-xs mt-1">
          Лозинката мора да има најмалку 6 карактери.
        </div> }
    </div>

    @if (errorMessage) {
    <div class="mb-4 text-red-500 text-sm text-center">
      {{ errorMessage }}
    </div>
    }

    <button
      type="submit"
      [disabled]="loginForm.invalid"
      class="w-full py-2 px-4 bg-blue-600 text-white font-semibold rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-gray-300 disabled:cursor-not-allowed">
      Најави се
    </button>
  </form>
</div>
