<header class="flex items-center justify-between px-8 py-4 bg-white shadow-sm border-b border-gray-100">
  <div class="flex items-center space-x-8">
    <div class="flex items-center space-x-2">
      <span class="bg-blue-600 text-white font-bold p-2 rounded-lg text-sm">S</span>
      <span class="font-extrabold text-xl text-gray-900 tracking-tight">ServiceHub</span>
    </div>
    <nav class="hidden md:flex space-x-6 text-sm font-medium text-gray-600">
      <a routerLink="/home" class="text-blue-600 hover:text-blue-700">Почетна</a>
      <a href="#" class="hover:text-blue-600">Барам услуга</a>
      <a  routerLink="/giving-services" class="hover:text-blue-600">Нудам услуга</a>
    </nav>
  </div>

  <div class="flex items-center space-x-4">
    <div class="bg-gray-100 p-1 rounded-lg flex text-xs font-semibold">
      <span class="bg-blue-600 text-white px-2 py-1 rounded shadow-sm">MK</span>
      <span class="text-gray-600 px-2 py-1 cursor-pointer">EN</span>
    </div>

    @if (user$ | async; as user) {
      <div>
        <span class="text-sm font-medium text-gray-800">Здраво, {{ user.firstName + ' ' + user.lastName }}</span>
        <button (click)="logout()"
                class="bg-red-500 hover:bg-red-600 text-white text-sm font-semibold px-4 py-2 rounded-lg shadow-md transition-all">
          Одјави се
        </button>
      </div>
    } @else {
      <div>
        <a routerLink="/login" class="text-sm font-semibold text-gray-700 hover:text-blue-600">Најави се</a>
        <a routerLink="/register"
           class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-4 py-2 rounded-lg shadow-md transition-all inline-block">
          Регистрирај се
        </a>
      </div>
    }
  </div>
</header>
