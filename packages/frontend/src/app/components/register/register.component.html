<div class="max-w-md mx-auto mt-12 p-6 bg-white border border-gray-200 rounded-lg shadow-md">
  <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Регистрација</h2>

  <form [formGroup]="registerForm" (ngSubmit)="onRegister()">
    <div class="mb-4">
      <label for="firstName" class="block text-sm font-medium text-gray-700 mb-1">Име:</label>
      <input
        id="firstName"
        type="text"
        formControlName="firstName"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="Вашето име"
      />
      <div *ngIf="registerForm.get('firstName')?.invalid && registerForm.get('firstName')?.touched" class="text-red-500 text-xs mt-1">
        Внесете име.
      </div>
    </div>

    <div class="mb-4">
      <label for="lastName" class="block text-sm font-medium text-gray-700 mb-1">Презиме:</label>
      <input
        id="lastName"
        type="text"
        formControlName="lastName"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="Вашето презиме"
      />
      <div *ngIf="registerForm.get('lastName')?.invalid && registerForm.get('lastName')?.touched" class="text-red-500 text-xs mt-1">
        Внесете презиме.
      </div>
    </div>

    <div class="mb-4">
      <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Е-пошта:</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="example@email.com"
      />
      <div *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched" class="text-red-500 text-xs mt-1">
        Внесете валидна е-пошта.
      </div>
    </div>

    <div class="mb-4">
      <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Лозинка:</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="••••••••"
      />
      <div *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched" class="text-red-500 text-xs mt-1">
        Лозинката мора да има најмалку 6 карактери.
      </div>
    </div>

    <div *ngIf="errorMessage" class="mb-4 text-red-500 text-sm text-center">
      {{ errorMessage }}
    </div>

    <button
      type="submit"
      [disabled]="registerForm.invalid"
      class="w-full py-2 px-4 bg-blue-600 text-white font-semibold rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-gray-300 disabled:cursor-not-allowed mb-4">
      Регистрирај се
    </button>

    <div class="text-center text-sm text-gray-600">
      Веќе имате профил? <a routerLink="/login" class="text-blue-600 hover:underline font-medium">Најавете се</a>
    </div>
  </form>
</div>
