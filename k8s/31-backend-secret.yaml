# Same demo-only caveat as k8s/11-mysql-secret.yaml: these are plain-text
# placeholders for local presentation purposes, not real production
# secrets. DB_USERNAME/DB_PASSWORD must match k8s/11-mysql-secret.yaml's
# MYSQL_USER/MYSQL_PASSWORD, and REDIS_PASSWORD must match what
# k8s/20-redis-deployment.yaml starts Redis with.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: servicehub
type: Opaque
stringData:
  DB_USERNAME: "servicehub"
  DB_PASSWORD: "changeme-db"
  REDIS_PASSWORD: "changeme-redis"
  JWT_SECRET: "changeme-jwt-secret"
  JWT_ACCESS_SECRET: "changeme-jwt-access-secret"
  JWT_REFRESH_SECRET: "changeme-jwt-refresh-secret"
  REFRESH_SECRET: "changeme-jwt-refresh-secret"
  HASH_SALT: "10"
  NODEMAILER_AUTH_USER: "example@gmail.com"
  NODEMAILER_AUTH_PASS: "changeme-app-password"
