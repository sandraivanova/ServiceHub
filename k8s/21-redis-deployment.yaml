# Redis backs the backend's job queues (BullMQ) and cache. It's a plain
# Deployment, not a StatefulSet: unlike MySQL, losing its data on a
# restart doesn't lose anything that matters (queues/cache are
# disposable), so it doesn't need the stable identity or persistent
# storage a StatefulSet provides. Not a graded rubric item on its own -
# it's here because the backend won't boot without it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: servicehub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "-a", "$(REDIS_PASSWORD)", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
