# MySQL credentials. Kubernetes Secrets are base64-encoded, not
# encrypted, by default - fine for a local course demo, but in a real
# deployment this would come from something like Sealed Secrets, SOPS,
# or a cloud secret manager instead of being committed to git.
#
# "stringData" lets you write plain text here; Kubernetes base64-encodes
# it into "data" for you when the object is created.
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: servicehub
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "changeme-root"
  MYSQL_USER: "servicehub"
  MYSQL_PASSWORD: "changeme-db"
