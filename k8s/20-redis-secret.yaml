# Kept separate from backend-secret (31-backend-secret.yaml) even though
# both apps need the same password value - the backend needs it to know
# how to authenticate to Redis, Redis needs it to know what to require.
# Two Secrets, same value, no cross-dependency between the app manifests.
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: servicehub
type: Opaque
stringData:
  REDIS_PASSWORD: "changeme-redis"
