# Orchestrates the whole ServiceHub app locally: MySQL (database),
# Redis (queues/cache), the NestJS backend, and the Angular frontend.
#
# Usage: copy .env.example to .env, fill in real values, then:
#   docker compose up --build
# Frontend:      http://localhost:8080
# Backend API:   http://localhost:3000/api
#
# See docs/02-docker-compose.md for the full walkthrough, including the
# one-time database migration step.

services:
  mysql:
    image: mysql:8.4
    container_name: servicehub-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    # No host port published: the backend reaches MySQL over the
    # "servicehub" Docker network by its service name ("mysql"). Run
    # migrations via `docker compose exec backend ...` instead of from
    # the host - see docs/02-docker-compose.md.
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - servicehub

  redis:
    image: redis:7-alpine
    container_name: servicehub-redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    # Same reasoning as mysql above: no host port needed, only the
    # backend talks to this, over the Docker network.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - servicehub

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: servicehub-backend
    restart: always
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000" # change the host-side port if 3000 is already taken on your machine
    networks:
      - servicehub

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: servicehub-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - servicehub

networks:
  servicehub:

volumes:
  mysql_data:
  redis_data:
