# Serves the built Angular app and reverse-proxies API calls to the
# backend, so the browser only ever talks to one origin. This is what
# lets the frontend call relative "/api/..." URLs instead of a hardcoded
# host — see docs/01-dockerization.md.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Angular client-side routing: any path that isn't a real file falls
    # back to index.html so the Angular router can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Everything under /api is the NestJS backend. "backend" resolves via
    # Docker/Kubernetes service discovery (see docker-compose.yml /
    # k8s/33-backend-service.yaml) to whatever host is actually running it.
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
